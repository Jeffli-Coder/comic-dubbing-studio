<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漫画配音工坊 · Comic Dubbing Studio</title>
  <link rel="stylesheet" href="/css/reader.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#books">🎧 漫画配音工坊</a>
    <nav id="nav">
      <a href="#books" data-nav="books">📚 书架 / 上传</a>
    </nav>
    <span id="health" class="health" title="服务自检">…</span>
  </header>

  <main id="view"></main>

  <!-- 音色面板浮层 -->
  <div id="voice-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3>🎙️ 角色音色</h3>
        <button class="icon-btn" id="voice-close">✕</button>
      </div>
      <div class="modal-body" id="voice-list"></div>
      <div class="modal-foot">
        <span class="hint">换音色只重合成该角色的台词，其余不重复调接口</span>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/js/app.js"></script>
  <script src="/js/upload.js"></script>
  <script src="/js/voices.js"></script>
  <script src="/js/reader.js"></script>
</body>
</html>
