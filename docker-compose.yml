services:
  app:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    image: comic-dubbing-studio:latest
    container_name: comic-dubbing-studio
    ports:
      # 默认只绑定本机，避免无鉴权服务直接暴露到局域网/公网。
      # 需要远程访问时：BIND_ADDR=0.0.0.0 docker compose up -d
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "8080"
      MOCK_MODE: ${MOCK_MODE:-0}
    env_file:
      - path: .env
        required: false
    volumes:
      - comic_data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

volumes:
  comic_data: