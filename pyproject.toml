[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:dashscope.*",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["legacy", ".venv", "data", "Vol_01_pages"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]