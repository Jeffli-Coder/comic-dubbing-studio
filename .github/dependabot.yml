version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
    # SDK 大版本需要人工验证真实接口，不自动升级
    # （单测使用 Mock，CI 绿不能证明 OpenAI 3.x 等大版本兼容）
    ignore:
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    # 基础镜像的大版本升级需要人工评估（3.14 尚未纳入 CI 测试矩阵）
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]