name: Feature request
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你遇到了什么场景/痛点？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望它如何工作？有替代方案吗？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / 额外信息
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: 流水线 / Provider
        - label: Web 前端
        - label: 部署 / Docker
        - label: 文档