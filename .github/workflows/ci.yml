name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.11" }
          - { os: ubuntu-latest,  python: "3.12" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest,   python: "3.12" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MOCK_MODE: "1"
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: pip check

      - name: Run tests (offline, mock providers)
        run: python -m pytest -q

      - name: Lint
        run: ruff check .

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: comic-dubbing-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (MOCK_MODE, no API keys)
        run: |
          docker run -d --name cds-ci -p 18080:8080 -e MOCK_MODE=1 comic-dubbing-studio:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker logs cds-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f cds-ci || true